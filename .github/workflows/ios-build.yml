      name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Extract RustBridge
        run: |
          cd Vendor/Minimuxer/RustBridge/lib
          tar xzf rustbridge.tar.gz
          ls -lh RustBridge.xcframework/

      - name: Build
        run: |
          xcodebuild -project SealBridge.xcodeproj \
            -scheme SealBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SealBridge.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Export IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/SealBridge.xcarchive/Products/Applications/SealBridge.app build/ipa/Payload/
          cd build/ipa && zip -r ../SealBridge.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SealBridge-ipa
          path: build/SealBridge.ipa
